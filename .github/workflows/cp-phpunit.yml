name: ClassicPress Unit Testing
on:
    push:
    pull_request:
jobs:
  phpunit:
    name: CP ${{ matrix.cp-version }} / PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    services:
     mysql:
       image: mariadb:10.4
       env:
         MYSQL_ROOT_PASSWORD: root
       ports:
         - 3306:3306
       options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=10s --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        cp-version: ['latest']
        php-versions: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer
          extensions: mysql
      - name: Install Composer dependencies for PHP
        uses: "ramsey/composer-install@v3"
      - name: Setup Test Environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/install-cp-tests.sh cpc_test root root 127.0.0.1 ${{ matrix.cp-version }}
      - name: Unit Testing
        run: composer phpunit
      - name: Confirm ClassicPress was tested
        run: |
          composer phpunit -- --filter=__no_tests__ | grep 'against ClassicPress'
