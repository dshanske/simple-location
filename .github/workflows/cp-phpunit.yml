name: ClassicPress Unit Testing
# Pull requests, and trunk after a merge. Branch pushes used to start a second, identical run next to the PR's.
on:
  push:
    branches:
    - trunk
  pull_request:
# A new push to a pull request cancels the runs for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  phpunit:
    name: CP ${{ matrix.cp-version }} / PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    # Jobs marked experimental report problems without failing the run.
    continue-on-error: ${{ matrix.experimental == true }}
    services:
     mysql:
       # MariaDB 10.4 is end of life. Newer images have no mysqladmin, so the health check uses their own script.
       image: mariadb:11.4
       env:
         MYSQL_ROOT_PASSWORD: root
       ports:
         - 3306:3306
       options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=10s --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        cp-version: ['latest']
        php-versions: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
        include:
          # ClassicPress 2.7 calls spl_object_hash() in _wp_filter_build_unique_id() (wp-includes/plugin.php),
          # which PHP 8.6 deprecates, so every test errors. Make it required again once ClassicPress fixes that.
          - cp-version: 'latest'
            php-versions: '8.6'
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer
          extensions: mysql
      - name: Install Composer dependencies for PHP
        uses: "ramsey/composer-install@v4"
      - name: Setup Test Environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/install-cp-tests.sh cpc_test root root 127.0.0.1 ${{ matrix.cp-version }}
      - name: Unit Testing
        run: composer phpunit
      - name: Confirm ClassicPress was tested
        run: |
          composer phpunit -- --filter=__no_tests__ | grep 'against ClassicPress'
