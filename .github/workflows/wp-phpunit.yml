name: WordPress Unit Testing
# Pull requests, and trunk after a merge. Branch pushes used to start a second, identical run next to the PR's.
on:
  push:
    branches:
    - trunk
  pull_request:
# A new push to a pull request cancels the runs for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  phpunit:
    name: WP ${{ matrix.wp-version }} / PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    # Jobs marked experimental report problems without failing the run.
    continue-on-error: ${{ matrix.experimental == true }}
    services:
     mysql:
       # MariaDB 10.4 is end of life. Newer images have no mysqladmin, so the health check uses their own script.
       image: mariadb:11.4
       env:
         MYSQL_ROOT_PASSWORD: root
       ports:
         - 3306:3306
       options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=10s --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        # Test the minimum supported WordPress (Requires at least) and the latest release.
        wp-version: ['6.2', 'latest']
        php-versions: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
        exclude:
          # WordPress 6.2 supports PHP up to 8.2.
          - wp-version: '6.2'
            php-versions: '8.3'
          - wp-version: '6.2'
            php-versions: '8.4'
          - wp-version: '6.2'
            php-versions: '8.5'
          - wp-version: '6.2'
            php-versions: '8.6'
        include:
          # The next WordPress, to catch problems before it is released.
          - wp-version: 'trunk'
            php-versions: '8.6'
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer
          extensions: mysql
      - name: Install Composer dependencies for PHP
        uses: "ramsey/composer-install@v4"
      - name: Setup Test Environment
        run: |
          sudo apt update
          sudo apt install subversion
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp-version }}
      - name: Unit Testing
        run: composer phpunit

  coverage:
    name: Code coverage (WP latest / PHP 8.4)
    runs-on: ubuntu-latest
    services:
     mysql:
       # MariaDB 10.4 is end of life. Newer images have no mysqladmin, so the health check uses their own script.
       image: mariadb:11.4
       env:
         MYSQL_ROOT_PASSWORD: root
       ports:
         - 3306:3306
       options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=10s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer
          extensions: mysql
      - name: Install Composer dependencies for PHP
        uses: "ramsey/composer-install@v4"
      - name: Setup Test Environment
        run: |
          sudo apt update
          sudo apt install subversion
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest
      - name: Unit Testing with Coverage
        run: php -d pcov.directory=. ./vendor/bin/phpunit --coverage-text=coverage.txt --coverage-clover=coverage.xml
      - name: Coverage Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,10p' coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.xml
